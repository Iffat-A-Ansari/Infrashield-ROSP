services:
  infrashield:
    build: .
    container_name: infrashield
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      DATA_DIR: /app/data
    volumes:
      - infrashield-data:/app/data
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    restart: unless-stopped

volumes:
  infrashield-data:
